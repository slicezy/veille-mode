name: Nettoyer une marque

on:
  workflow_dispatch:
    inputs:
      marques:
        description: "Identifiants des marques à vider (séparés par des virgules, comme dans config/brands.json)"
        required: true
        default: "venroy,henne,benni"

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retirer les produits de ces marques
        run: python collector/purge.py "${{ inputs.marques }}"

      - name: Enregistrer les données
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Nettoyage de marques : ${{ inputs.marques }}"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
          git diff --quiet origin/main HEAD || { echo "Envoi impossible"; exit 1; }
