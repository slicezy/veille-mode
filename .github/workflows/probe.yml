name: Diagnostic des sites

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page à analyser en détail"
        required: false
        default: "https://www.thereformation.com/new/this-week"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Analyser la page
        run: python collector/probe.py --deep "${{ inputs.url }}" --out data/probe-report.md

      - name: Enregistrer le rapport
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/probe-report.md
          git diff --cached --quiet || git commit -m "Rapport de diagnostic"
          git pull --rebase
          git push
